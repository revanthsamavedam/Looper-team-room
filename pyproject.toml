[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-looper"
version = "0.1.0"
description = "A minimal Hermes-architecture agent loop — not a fork, a re-implementation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
# The looper core (looper/) is stdlib-only. These deps are for the
# Team Room web UI (teamroom/) — and Vercel's Python runtime installs
# from this file, so they must be listed here for the deploy to work.
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  # libsql client for the Turso backend (teamroom/store.py). The
  # looper core stays stdlib-only; libsql is only imported when
  # TURSO_URL is set.
  "libsql>=0.1",
]

[project.scripts]
looper = "looper.cli:main"

[tool.setuptools.packages.find]
include = ["looper*"]
